<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#faf9f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>今日食篮 Basket Day</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#282923;background:#faf9f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}main{max-width:480px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(94px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding-top:22px}.eyebrow{font-size:12px;letter-spacing:1.8px;color:#989c92}.title{font:normal 34px Georgia,serif;margin:5px 0 4px}.subtitle{font-size:14px;color:#858980;margin:0}.circle{border:1px solid #d8ddd4;border-radius:50%;width:42px;height:42px;background:white;font-size:26px;color:#6d8366}.section{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section h2{font-size:12px;letter-spacing:2px;margin:0}.muted{font-size:12px;color:#92968c}.basket{height:295px;position:relative;border:8px solid #ded4bd;border-radius:50% 50% 44% 44%/37% 37% 43% 43%;background:repeating-linear-gradient(35deg,#f2ecdd 0 11px,#ede4d2 12px 14px,#f4eedf 15px 24px);box-shadow:0 12px 26px #77704417,inset 0 0 0 3px #cfc0a2;overflow:hidden;touch-action:none}.food{position:absolute;border:none;background:none;font-size:38px;width:53px;height:55px;text-align:center;line-height:55px;filter:drop-shadow(0 4px 3px #54432b22);user-select:none;touch-action:none;transition:transform .14s}.food:active{transform:scale(1.2)}.hint{text-align:center;font-size:12px;color:#999d92;margin:16px 0}.pot{min-height:175px;border:6px solid #d6c9b4;background:radial-gradient(circle,#f8f5ee,#ece6d9);border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;padding:25px 38px;margin:0 auto;width:84%;box-shadow:0 8px 19px #aca19021;touch-action:none}.pot:before,.pot:after{content:'';position:absolute;background:#d6c9b4;top:43%;height:27px;width:37px;border-radius:13px}.pot:before{left:-33px}.pot:after{right:-33px}.pot span{font-size:36px}.pot .empty{font-size:13px;color:#a3a094}.modes{display:flex;gap:9px;overflow:auto;margin:19px 0 13px;padding-bottom:3px}.mode{border:1px solid #e8e7e1;background:white;border-radius:16px;min-width:75px;padding:11px 8px;font-size:12px;color:#70776d}.mode b{display:block;font-size:20px;margin-bottom:4px}.mode.selected{border-color:#96a78b;background:#f1f4ed;color:#53694b}.primary{border:0;background:#91a384;color:white;border-radius:19px;padding:15px;font-weight:600;width:100%;margin:8px 0}.primary:disabled{opacity:.45}.secondary{border:1px solid #dde2d9;background:white;padding:12px;border-radius:15px;color:#5e7159}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefdf5;border-top:1px solid #ebece7;display:flex;justify-content:space-around;padding:12px 0 calc(13px + env(safe-area-inset-bottom));z-index:8}.nav button{background:none;border:0;color:#91968d;font-size:12px;min-width:60px}.nav button .ico{font-size:21px;display:block;margin-bottom:2px}.nav .active{color:#718b67}.hidden{display:none!important}.card{border:1px solid #efefe9;background:white;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 15px #8e948008}.cardrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.bigemoji{font-size:38px}.controls{display:flex;gap:8px;align-items:center}.controls button{border:0;background:#f3f4f0;border-radius:11px;width:34px;height:34px;font-size:19px}.small{font-size:12px;color:#91958d}.line{height:1px;background:#eeeeea;margin:16px 0}.overlay{position:fixed;inset:0;background:#0005;z-index:10;display:flex;align-items:end;justify-content:center}.sheet{width:min(100%,480px);background:#fff;border-radius:25px 25px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}.sheet h2{margin:0 0 17px;font-size:22px}input,select{width:100%;border:1px solid #e9ebe5;border-radius:13px;padding:12px;background:#fbfbf9;margin:7px 0 12px;color:#292e26}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{border:1px solid #efefe9;background:#fafaf8;border-radius:15px;padding:13px 6px;font-size:12px}.tile span{display:block;font-size:29px;margin-bottom:7px}.badge{background:#edf1e8;border-radius:20px;padding:6px 9px;font-size:11px;color:#728266}.toast{position:fixed;bottom:93px;left:50%;transform:translateX(-50%);background:#384239;color:#fff;border-radius:18px;padding:12px 18px;font-size:13px;z-index:20;white-space:nowrap}.dragging{position:fixed!important;pointer-events:none;z-index:100;opacity:.9;transform:scale(1.25)}
</style></head><body><main><section id="home"><div class="top"><div><div class="eyebrow">BASKET DAY · 今日食篮</div><h1 class="title">Good morning ☀</h1><p class="subtitle">今天想吃些什么？</p></div><button class="circle" onclick="openAdd()">+</button></div><div class="section"><h2>MY BASKET</h2><span class="muted" id="basketCount"></span></div><div id="basket" class="basket"></div><p class="hint">长按食材拖入锅中，或轻点食材添加 ↓</p><div class="pot" id="pot"><span class="empty">把食材放进来吧</span></div><div class="modes" id="modes"></div><button class="secondary" style="width:100%" onclick="undoOne()">↶ 撤回上一个食材</button><button class="primary" onclick="complete()">完成料理 · 保存食记</button></section><section id="diary" class="hidden"><div class="top"><div><div class="eyebrow">YOUR LITTLE FOOD JOURNAL</div><h1 class="title">My Diary</h1><p class="subtitle">每天吃过的美好瞬间</p></div></div><div class="section"><h2>选择日期</h2></div><input type="date" id="diaryDate" onchange="renderDiary()"><div id="diaryItems"></div></section><section id="pantry" class="hidden"><div class="top"><div><div class="eyebrow">WHAT'S IN YOUR KITCHEN</div><h1 class="title">My Pantry</h1><p class="subtitle">每一份食材都看得见</p></div><button class="circle" onclick="openAdd()">+</button></div><div class="section"><h2>现有食材</h2><span class="muted">点击 + / − 修改库存</span></div><div id="pantryItems"></div><div class="section"><h2>SHOPPING LIST</h2><span class="muted">低库存建议</span></div><div id="shoppingItems"></div></section></main><div class="nav"><button class="active" data-page="home" onclick="tab('home')"><span class="ico">⌂</span>首页</button><button data-page="diary" onclick="tab('diary')"><span class="ico">▤</span>食记</button><button data-page="pantry" onclick="tab('pantry')"><span class="ico">▱</span>食材</button></div><div class="overlay hidden" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div class="toast hidden" id="toast"></div><script>
const foods=[['土豆','🥔'],['番茄','🍅'],['鸡蛋','🥚'],['生菜','🥬'],['面包','🍞'],['胡萝卜','🥕'],['西兰花','🥦'],['黄瓜','🥒'],['牛油果','🥑'],['苹果','🍎'],['牛奶','🥛'],['玉米','🌽'],['芝士','🧀'],['洋葱','🧅'],['青椒','🫑'],['米饭','🍚'],['香蕉','🍌'],['鱼','🐟'],['鸡肉','🍗']];
const modes=[['三明治','🥪'],['水煮菜','🥘'],['沙拉','🥗'],['煎炒','🍳'],['汤','🍲'],['直接食用','🍎']];const key='basketday-pwa-v1';let db;try{db=JSON.parse(localStorage.getItem(key))}catch{}if(!db||!db.inventory){db={inventory:{土豆:3,番茄:3,鸡蛋:5,生菜:2,面包:4,胡萝卜:2},thresholds:{土豆:2,番茄:2,鸡蛋:3,生菜:1,面包:2},diary:[]}}let cooking=[],mode=0;const em=n=>foods.find(f=>f[0]===n)?.[1]||'🥣',save=()=>{localStorage.setItem(key,JSON.stringify(db));render()};const today=()=>new Date().toLocaleDateString('en-CA');document.getElementById('diaryDate').value=today();function notice(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1900)}
function render(){let box=document.getElementById('basket');box.innerHTML='';const entries=Object.entries(db.inventory).filter(([n,q])=>q>0);let pieces=[];entries.forEach(([n,q])=>{for(let i=0;i<Math.min(q,24);i++)pieces.push(n)});document.getElementById('basketCount').textContent=pieces.length+' 件可见食材';pieces.forEach((n,i)=>{let el=document.createElement('button');el.className='food';el.textContent=em(n);el.title='添加 '+n;let col=i%5,row=Math.floor(i/5), jitter=((i*13)%19)-9;el.style.left=(7+col*17+(row%2)*3)+'%';el.style.top=(8+row*48+jitter*.3)+'px';el.dataset.food=n;addFoodPointer(el,n);box.appendChild(el)});if(!pieces.length)box.innerHTML='<div style="text-align:center;padding:115px 0;color:#998f7d;font-size:13px">菜篮空啦，点右上角 + 添加食材</div>';let pot=document.getElementById('pot');pot.innerHTML=cooking.length?cooking.map(n=>'<span>'+em(n)+'</span>').join(''):'<span class="empty">把食材放进来吧</span>';document.getElementById('modes').innerHTML=modes.map(([n,e],i)=>'<button class="mode '+(mode===i?'selected':'')+'" onclick="mode='+i+';render()"><b>'+e+'</b>'+n+'</button>').join('');document.getElementById('pantryItems').innerHTML=entries.map(([n,q])=>'<div class="card cardrow"><div><span class="bigemoji">'+em(n)+'</span> <b>'+n+'</b><div class="small">剩余 '+q+' 件</div></div><div class="controls"><button onclick="change(\''+n+'\',-1)">−</button><b>'+q+'</b><button onclick="change(\''+n+'\',1)">+</button></div></div>').join('')||'<div class="card">还没有食材</div>';let low=Object.entries(db.thresholds).filter(([n,t])=>(db.inventory[n]||0)<=t);document.getElementById('shoppingItems').innerHTML=low.map(([n,t])=>'<div class="card cardrow"><div><b>'+em(n)+' '+n+'</b><div class="small">剩余 '+(db.inventory[n]||0)+' · 目标 '+(t+1)+'</div></div><span class="badge">建议补货</span></div>').join('')||'<p class="small">目前没有低库存食材 🌿</p>';renderDiary()}
let touchTimer;function addFoodPointer(el,n){let sx,sy,moved=false,ghost;el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(sx==null)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>12){moved=true;if(!ghost){ghost=document.createElement('div');ghost.className='food dragging';ghost.textContent=em(n);document.body.appendChild(ghost)}ghost.style.left=e.clientX-26+'px';ghost.style.top=e.clientY-30+'px'}});function end(e){if(sx==null)return;let r=document.getElementById('pot').getBoundingClientRect();if(!moved||e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)addCooking(n);else if(moved)notice('请拖动到锅里');ghost?.remove();ghost=null;sx=undefined}el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;sx=undefined})}
function addCooking(n){if((db.inventory[n]||0)-cooking.filter(v=>v===n).length<=0){notice('库存不够啦');return}cooking.push(n);render()}function undoOne(){if(!cooking.length)return; cooking.pop();render()}function change(n,v){db.inventory[n]=Math.max(0,(db.inventory[n]||0)+v);cooking=cooking.filter((x,i,a)=>a.slice(0,i+1).filter(z=>z===n).length<=(db.inventory[n]||0));save()}
function openAdd(){document.getElementById('sheet').innerHTML='<h2>添加食材 <span style="float:right;cursor:pointer" onclick="closeModal()">×</span></h2><input id="search" placeholder="搜索食材..." oninput="filterFoods()"><div class="grid" id="foodGrid"></div><div class="line"></div><label class="small">数量</label><div class="cardrow"><input type="number" id="qty" min="1" max="99" value="1" style="width:110px"><button class="primary" style="width:60%" onclick="commitAdd()">添加到菜篮</button></div><p class="small" id="selectedFood">先选一种食材</p>';window.selectedFood=null;filterFoods();document.getElementById('modal').classList.remove('hidden')};function filterFoods(){let q=document.getElementById('search').value;document.getElementById('foodGrid').innerHTML=foods.filter(([n])=>n.includes(q)).map(([n,e])=>'<button class="tile" onclick="selectedFood=\''+n+'\';document.getElementById(\'selectedFood\').textContent=\'已选择：'+n+'\'"><span>'+e+'</span>'+n+'</button>').join('')};function commitAdd(){if(!window.selectedFood)return notice('请先选择食材');let q=Math.max(1,Math.min(99,Number(document.getElementById('qty').value)||1));db.inventory[selectedFood]=(db.inventory[selectedFood]||0)+q;save();closeModal();notice('已放入 '+q+' 个'+selectedFood)}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function complete(){if(!cooking.length)return notice('先放入食材哦');const summary=[...new Set(cooking)].map(n=>n+' × '+cooking.filter(a=>a===n).length).join('、');document.getElementById('sheet').innerHTML='<h2>保存这顿饭</h2><p class="subtitle">'+modes[mode][1]+' '+modes[mode][0]+'</p><div class="card">'+summary+'</div><label class="small">餐次</label><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select><label class="small">日期</label><input type="date" id="mealDate" value="'+today()+'"><label class="small">备注（可选）</label><input id="mealNotes" placeholder="今天味道怎么样？"><button class="primary" onclick="saveMeal()">确认保存并扣减库存</button><button class="secondary" style="width:100%" onclick="closeModal()">继续编辑</button>';document.getElementById('modal').classList.remove('hidden')}
function saveMeal(){let counts={};cooking.forEach(n=>counts[n]=(counts[n]||0)+1);Object.entries(counts).forEach(([n,q])=>db.inventory[n]=Math.max(0,(db.inventory[n]||0)-q));db.diary.unshift({id:Date.now(),date:document.getElementById('mealDate').value,meal:document.getElementById('meal').value,mode:modes[mode][0],emoji:modes[mode][1],items:counts,note:document.getElementById('mealNotes').value,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});cooking=[];save();closeModal();tab('diary');document.getElementById('diaryDate').value=db.diary[0].date;renderDiary();notice('保存成功，菜篮库存已更新')}
function renderDiary(){let date=document.getElementById('diaryDate').value;let groups=['早餐','午餐','晚餐','加餐'];document.getElementById('diaryItems').innerHTML=groups.map(g=>{let records=db.diary.filter(d=>d.date===date&&d.meal===g);return '<div class="section"><h2>'+g+'</h2></div>'+(records.length?records.map(d=>'<div class="card"><div class="cardrow"><div><div style="font-size:27px">'+d.emoji+' <b style="font-size:16px">'+d.mode+'</b></div><div class="small">'+d.time+' · '+Object.entries(d.items).map(([n,q])=>n+' ×'+q).join(' · ')+'</div>'+(d.note?'<div class="small">'+escapeHTML(d.note)+'</div>':'')+'</div><button class="secondary" onclick="delMeal('+d.id+')">删除</button></div></div>').join(''):'<div class="card small">还没有记录</div>')}).join('')};function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function delMeal(id){let m=db.diary.find(d=>d.id===id);if(!m||!confirm('删除记录并将食材退回菜篮？'))return;Object.entries(m.items).forEach(([n,q])=>db.inventory[n]=(db.inventory[n]||0)+q);db.diary=db.diary.filter(d=>d.id!==id);save()}
function tab(p){['home','diary','pantry'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==p));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));window.scrollTo(0,0)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
